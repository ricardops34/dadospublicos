name: Docker Build and Push

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Tag das imagens Docker
        required: true
        default: latest
        type: string
      no_cache:
        description: Desabilita cache do Docker Buildx
        required: true
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  DOCKER_REGISTRY: docker.io
  DOCKER_NAMESPACE: bjsoftware

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolver parâmetros
        id: vars
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            IMAGE_TAG="${{ inputs.image_tag }}"
            NO_CACHE="${{ inputs.no_cache }}"
          else
            IMAGE_TAG="${GITHUB_REF_NAME}"
            NO_CACHE="false"
          fi

          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "no_cache=${NO_CACHE}" >> "$GITHUB_OUTPUT"

      - name: Build e push do backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          no-cache: ${{ steps.vars.outputs.no_cache == 'true' }}
          tags: ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_NAMESPACE }}/rfb-api:${{ steps.vars.outputs.image_tag }}
          cache-from: type=gha,scope=rfb-api
          cache-to: type=gha,mode=max,scope=rfb-api

      - name: Build e push do frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          no-cache: ${{ steps.vars.outputs.no_cache == 'true' }}
          tags: ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_NAMESPACE }}/rfb-frontend:${{ steps.vars.outputs.image_tag }}
          cache-from: type=gha,scope=rfb-frontend
          cache-to: type=gha,mode=max,scope=rfb-frontend
