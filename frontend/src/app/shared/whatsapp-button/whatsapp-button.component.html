<!-- Janela de chat -->
<div class="wpp-chat" *ngIf="aberto">

  <!-- Header comum -->
  <div class="wpp-chat__header">
    <div class="wpp-chat__avatar">
      <span class="an an-user-circle"></span>
      <span class="wpp-chat__online"></span>
    </div>
    <div class="wpp-chat__info">
      <strong>{{ atendente }}</strong>
      <small>Online</small>
    </div>
    <button class="wpp-chat__close" (click)="fechar()" aria-label="Fechar">
      <span class="an an-x"></span>
    </button>
  </div>

  <!-- Passo 1: Chat inicial -->
  <ng-container *ngIf="passo === 'chat'">
    <div class="wpp-chat__body">
      <div class="wpp-chat__bubble">{{ boasVindas }}</div>
    </div>
    <div class="wpp-chat__footer-btn">
      <button class="wpp-chat__start-btn" (click)="irParaForm()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
        </svg>
        Iniciar conversa
      </button>
    </div>
  </ng-container>

  <!-- Passo 2: Formulário -->
  <ng-container *ngIf="passo === 'form'">
    <div class="wpp-chat__form">
      <input class="wpp-chat__field" type="text"  placeholder="Seu nome *"  [(ngModel)]="nome" />
      <input class="wpp-chat__field" type="email" placeholder="Seu e-mail *" [(ngModel)]="email" />
      <textarea class="wpp-chat__field wpp-chat__field--area"
        placeholder="Como podemos ajudar? *"
        rows="3"
        [(ngModel)]="mensagem">
      </textarea>
      <button class="wpp-chat__start-btn" [disabled]="enviando || !nome || !email || !mensagem" (click)="enviar()">
        <span *ngIf="!enviando">Enviar mensagem</span>
        <span *ngIf="enviando">Enviando...</span>
      </button>
    </div>
  </ng-container>

  <!-- Passo 3: Confirmação -->
  <ng-container *ngIf="passo === 'enviado'">
    <div class="wpp-chat__body wpp-chat__body--center">
      <div class="wpp-chat__success">
        <span class="an an-check-circle"></span>
        <strong>Mensagem enviada!</strong>
        <p>Em breve nossa equipe entrará em contato.</p>
        <button class="wpp-chat__link-btn" (click)="reiniciar()">Nova mensagem</button>
      </div>
    </div>
  </ng-container>

</div>

<!-- Botão flutuante -->
<button class="wpp-btn" (click)="toggle()" aria-label="Falar com suporte via WhatsApp">
  <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor">

  </svg>
  <span class="wpp-btn__ping"></span>
</button>
