<!-- Janela de chat -->
<div class="wpp-chat" *ngIf="aberto">

  <!-- Header -->
  <div class="wpp-chat__header">
    <div class="wpp-chat__avatar">
      <span class="an an-user-circle"></span>
      <span class="wpp-chat__dot"></span>
    </div>
    <div class="wpp-chat__info">
      <strong>{{ atendente }}</strong>
      <small><span class="wpp-chat__dot--inline"></span> Online</small>
    </div>
    <button class="wpp-chat__close" (click)="fechar()" aria-label="Fechar">
      <span class="an an-x"></span>
    </button>
  </div>

  <!-- Mensagens -->
  <div class="wpp-chat__body" #chatBody>
    <div
      *ngFor="let msg of mensagens"
      class="wpp-msg"
      [class.wpp-msg--bot]="msg.tipo === 'bot'"
      [class.wpp-msg--user]="msg.tipo === 'usuario'">
      {{ msg.texto }}
    </div>

    <!-- Indicador "digitando..." -->
    <div class="wpp-typing" *ngIf="digitando">
      <span class="wpp-typing__dot"></span>
      <span class="wpp-typing__dot"></span>
      <span class="wpp-typing__dot"></span>
    </div>
  </div>

  <!-- Input -->
  <div class="wpp-chat__input-row" *ngIf="passo <= 3">
    <input
      class="wpp-chat__input"
      type="text"
      placeholder="Digite sua resposta..."
      [(ngModel)]="inputValor"
      (keydown)="onEnter($event)"
      [disabled]="digitando || enviando"
      autofocus />
    <button class="wpp-chat__send" (click)="enviar()" [disabled]="digitando || enviando || !inputValor.trim()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
      </svg>
    </button>
  </div>

</div>

<!-- Botão flutuante -->
