<section class="rfb-planos" id="planos">
  <div class="rfb-planos__container">
    <div class="rfb-section-header">
      <h2>Planos e precos</h2>
    </div>

    <div class="rfb-planos__cycles" role="tablist" aria-label="Ciclo de cobranca">
      <button
        *ngFor="let ciclo of ciclos"
        type="button"
        class="rfb-planos__cycle"
        [class.rfb-planos__cycle--active]="cicloSelecionado === ciclo.id"
        (click)="selecionarCiclo(ciclo.id)">
        <span [ngClass]="ciclo.icone"></span>
        {{ ciclo.label }}
      </button>
    </div>

    <div *ngIf="carregando" class="rfb-planos__estado">
      Carregando planos...
    </div>

    <div *ngIf="!carregando && erroCarregamento" class="rfb-planos__estado">
      Nao foi possivel carregar os planos agora.
    </div>

    <div class="rfb-planos__grid">
      <div class="rfb-planos__wrapper" *ngFor="let p of planos">
        <div class="rfb-planos__selo" [class.rfb-planos__selo--visivel]="!!p.seloDestaque">
          <span *ngIf="p.seloDestaque" class="an an-crown"></span>
          {{ p.seloDestaque }}
        </div>

        <div
          class="rfb-planos__card"
          [class.rfb-planos__card--destaque]="p.destaque">

          <div class="rfb-planos__header">
            <h3 class="rfb-planos__nome">{{ p.nome }}</h3>
            <p class="rfb-planos__desc">{{ p.descricao }}</p>
            <div class="rfb-planos__preco">
              <span class="rfb-planos__valor">{{ formatarPreco(precoDoPlano(p)) }}</span>
              <span class="rfb-planos__periodo">{{ periodoDoPlano() }}</span>
            </div>
            <p class="rfb-planos__billing">{{ rotuloCobranca(p) }}</p>
          </div>

          <ul class="rfb-planos__features">
            <li *ngFor="let recurso of p.recursos">
              <span class="an an-check-circle rfb-planos__fi"></span>
              {{ recurso.descricaoExibicao }}
            </li>
          </ul>

          <po-button
            *ngIf="registrosHabilitados"
            p-label="Assinar agora"
            [p-kind]="p.destaque ? 'primary' : 'secondary'"
            [p-icon]="p.destaque ? 'an an-rocket-launch' : 'an an-arrow-right'"
            p-size="large"
            class="rfb-planos__cta"
            (p-click)="irParaCadastro(p)">
          </po-button>
          <po-button
            *ngIf="!registrosHabilitados"
            p-label="Em breve"
            p-kind="secondary"
            p-icon="an an-clock"
            p-size="large"
            [p-disabled]="true"
            class="rfb-planos__cta">
          </po-button>
        </div>
      </div>
    </div>
  </div>
</section>
