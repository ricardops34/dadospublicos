<section class="rfb-planos" id="planos">
  <div class="rfb-planos__container">
    <div class="rfb-section-header">
      <h2>Planos e preços</h2>
    </div>

    <div class="rfb-planos__cycles" role="tablist" aria-label="Ciclo de cobrança">
      <button
        *ngFor="let ciclo of ciclos"
        type="button"
        class="rfb-planos__cycle"
        [class.rfb-planos__cycle--active]="cicloSelecionado === ciclo.id"
        (click)="selecionarCiclo(ciclo.id)">
        {{ ciclo.label }}
      </button>
    </div>

    <div class="rfb-planos__grid">
      <div
        class="rfb-planos__card"
        [class.rfb-planos__card--destaque]="p.destaque"
        *ngFor="let p of planos">

        <div class="rfb-planos__destaque-badge" *ngIf="p.seloDestaque">{{ p.seloDestaque }}</div>

        <div class="rfb-planos__header">
          <h3 class="rfb-planos__nome">{{ p.nome }}</h3>
          <p class="rfb-planos__desc">{{ p.descricao }}</p>
          <div class="rfb-planos__preco">
            <span class="rfb-planos__valor">{{ formatarPreco(precoDoPlano(p)) }}</span>
            <span class="rfb-planos__periodo">{{ periodoDoPlano() }}</span>
          </div>
          <p class="rfb-planos__billing">{{ rotuloCobranca(p) }}</p>
        </div>

        <ul class="rfb-planos__features">
          <li *ngFor="let recurso of p.recursos">
            <span class="an an-check-circle rfb-planos__fi"></span>
            {{ recurso.descricaoExibicao }}
          </li>
        </ul>

        <po-button
          p-label="Assinar"
          [p-kind]="p.destaque ? 'primary' : 'secondary'"
          p-size="large"
          class="rfb-planos__cta"
          p-url="/cliente/cadastro">
        </po-button>
      </div>
    </div>
  </div>
</section>
