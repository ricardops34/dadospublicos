<po-page-default p-title="Faturas">

  <div class="po-row" style="margin-bottom:16px; align-items:flex-end; gap:12px;">
    <po-select
      class="po-md-3"
      p-label="Status"
      [p-options]="statusOptions"
      [ngModel]="filtroStatus"
      (ngModelChange)="filtroStatus = $event; onFiltroChange()">
    </po-select>
    <div style="margin-left:auto;">
      <po-button
        p-label="Gerar faturas do mês"
        p-kind="secondary"
        p-icon="an an-calendar-plus"
        (p-click)="gerarMensais()">
      </po-button>
    </div>
  </div>

  <po-table
    [p-columns]="colunas"
    [p-items]="faturas"
    [p-actions]="acoes"
    [p-loading]="carregando"
    p-striped="true"
    p-sort="true"
    [p-height]="500">
  </po-table>

  <div class="po-row" style="margin-top:16px; justify-content:flex-end;">
    <div style="display:flex; align-items:center; gap:12px;">
      <span style="color:#64748b; font-size:0.875rem;">Página {{ pagina }}</span>
      <po-button
        p-label="Anterior"
        p-kind="tertiary"
        [p-disabled]="pagina <= 1"
        (p-click)="onPaginaChange(pagina - 1)">
      </po-button>
      <po-button
        p-label="Próxima"
        p-kind="tertiary"
        [p-disabled]="pagina * limite >= total"
        (p-click)="onPaginaChange(pagina + 1)">
      </po-button>
    </div>
  </div>

</po-page-default>

<!-- Modal de pagamento -->
<po-modal
  #modalPagamento
  p-title="Confirmar pagamento"
  p-size="sm"
  [p-primary-action]="confirmacaoPagamento"
  [p-secondary-action]="cancelarPagamento">

  <ng-container *ngIf="faturaSelecionada">
    <po-info p-label="Cliente"     [p-value]="faturaSelecionada.cliente"></po-info>
    <po-info p-label="Competência" [p-value]="faturaSelecionada.competencia"></po-info>
    <po-info p-label="Valor"       [p-value]="'R$ ' + faturaSelecionada.valor"></po-info>

    <po-divider p-label="Nota Fiscal (opcional)"></po-divider>

    <po-input
      p-label="Número da NF"
      p-placeholder="Ex: 000123"
      [(ngModel)]="numeroNf">
    </po-input>
    <po-input
      p-label="URL da NF"
      p-placeholder="https://..."
      [(ngModel)]="urlNf">
    </po-input>
  </ng-container>

</po-modal>
