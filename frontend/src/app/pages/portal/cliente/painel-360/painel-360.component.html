<po-page-default p-title="Painel 360">
  <div class="p360">

    <!-- Barra de filtros -->
    <div class="p360__filtros">
      <div class="po-row">
        <po-select
          class="po-md-2 po-sm-12"
          name="uf"
          p-label="Estado"
          [ngModel]="filtros.uf"
          (ngModelChange)="filtros.uf = $event; onUfChange($event)"
          [p-options]="ufOptions"
          p-placeholder="Selecione">
        </po-select>

        <po-combo
          class="po-md-3 po-sm-12"
          name="municipio"
          p-label="Município"
          [ngModel]="filtros.municipio"
          (ngModelChange)="filtros.municipio = $event"
          [p-options]="municipioOptions"
          [p-disabled]="!filtros.uf"
          [p-loading]="carregandoMunicipios"
          p-placeholder="Selecione um município">
        </po-combo>

        <po-input
          class="po-md-2 po-sm-12"
          name="bairro"
          p-label="Bairro"
          [(ngModel)]="filtros.bairro"
          p-placeholder="Digite o bairro">
        </po-input>

        <po-multiselect
          class="po-md-3 po-sm-12"
          name="cnaes"
          p-label="CNAE"
          [(ngModel)]="filtros.cnaes"
          [p-options]="cnaeOptions"
          [p-loading]="carregandoCnaes"
          p-placeholder="Selecione atividades"
          p-placeholder-search="Buscar CNAE">
        </po-multiselect>

        <div class="po-md-2 po-sm-12 p360__acoes">
          <po-button
            p-label="Pesquisar"
            p-kind="primary"
            p-icon="an an-magnifying-glass"
            [p-loading]="pesquisando"
            (p-click)="pesquisar()">
          </po-button>
          <po-button
            p-label="Relatório"
            p-kind="secondary"
            p-icon="an an-download-simple"
            [p-disabled]="!consultaId"
            (p-click)="gerarRelatorio()">
          </po-button>
          <po-button
            p-label="Limpar"
            p-kind="tertiary"
            p-icon="an an-x"
            (p-click)="limparFiltros()">
          </po-button>
        </div>
      </div>

      <div *ngIf="consultaId" class="p360__resumo">
        <span class="an an-map-pin-line p360__resumo-icon"></span>
        <strong>{{ totalGeocod }}</strong> pontos no mapa
        <span class="p360__resumo-sep">•</span>
        <strong>{{ totalResultados }}</strong> registros encontrados
      </div>
    </div>

    <!-- Mapa -->
    <div class="p360__mapa">
      <app-painel-360-mapa
        [geoJson]="geoJson"
        [loading]="pesquisando"
        altura="500px">
      </app-painel-360-mapa>
    </div>

    <!-- Histórico de consultas -->
    <div class="p360__historico">
      <po-divider p-label="Consultas salvas"></po-divider>
      <po-table
        [p-columns]="colunasConsultas"
        [p-items]="consultasView"
        [p-actions]="acoesConsultas"
        [p-loading]="carregandoConsultas"
        p-striped="true">
      </po-table>
    </div>

  </div>
</po-page-default>
