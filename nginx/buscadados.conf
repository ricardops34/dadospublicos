server {
    listen 80;
    server_name buscadados.bjsoft.com.br;

    # Redireciona HTTP → HTTPS (após configurar SSL com certbot)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name buscadados.bjsoft.com.br;

    # Certificados Let's Encrypt (gerados pelo certbot)
    ssl_certificate     /etc/letsencrypt/live/buscadados.bjsoft.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/buscadados.bjsoft.com.br/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /var/www/buscadados/frontend;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Cache de assets com hash (Angular gera hash no nome)
    location ~* \.(js|css|png|jpg|svg|woff2?|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA — todas as rotas caem no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name api.buscadados.bjsoft.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.buscadados.bjsoft.com.br;

    ssl_certificate     /etc/letsencrypt/live/api.buscadados.bjsoft.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.buscadados.bjsoft.com.br/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # CORS para o frontend
    add_header Access-Control-Allow-Origin  "https://buscadados.bjsoft.com.br" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "x_api_token, Content-Type" always;

    location / {
        if ($request_method = 'OPTIONS') { return 204; }

        proxy_pass         http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Swagger docs
    location /docs {
        proxy_pass http://localhost:3001/docs;
    }
}
