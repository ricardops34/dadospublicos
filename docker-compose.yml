version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: rfb_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rfb_user
      POSTGRES_PASSWORD: rfb_pass
      POSTGRES_DB: dados_rfb
    volumes:
      - rfb_pgdata:/var/lib/postgresql/data
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rfb_user -d dados_rfb']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: rfb_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: rfb_user
      DB_PASSWORD: rfb_pass
      DB_NAME: dados_rfb
      ETL_DOWNLOAD_DIR: /app/etl-data/downloads
      ETL_EXTRACT_DIR: /app/etl-data/extraidos
    volumes:
      - rfb_etldata:/app/etl-data
    ports:
      - '3001:3001'

volumes:
  rfb_pgdata:
  rfb_etldata:
