services:
  postgres:
    image: postgres:16-alpine
    container_name: rfb_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-rfb_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-rfb_pass}
      POSTGRES_DB: ${DB_NAME:-dados_rfb}
    volumes:
      - rfb_pgdata:/var/lib/postgresql/data
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-rfb_user} -d ${DB_NAME:-dados_rfb}']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: rfb_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-rfb_user}
      DB_PASSWORD: ${DB_PASSWORD:-rfb_pass}
      DB_NAME: ${DB_NAME:-dados_rfb}
      ADMIN_KEY: ${ADMIN_KEY}
      JWT_SECRET: ${JWT_SECRET:-rfb-portal-secret}
      # Diretórios ETL mapeados diretamente no host — persistem entre deploys e rebuilds
      ETL_DOWNLOAD_DIR: /app/etl-data/downloads
      ETL_EXTRACT_DIR: /app/etl-data/extraidos
    volumes:
      # ZIPs e CSVs ficam no host (./etl-data/) — não são gerenciados pelo Docker
      # Isso permite: reusar entre rebuilds, fazer backup externo, montar NFS/SSD dedicado
      - ${ETL_DATA_DIR:-./etl-data}/downloads:/app/etl-data/downloads
      - ${ETL_DATA_DIR:-./etl-data}/extraidos:/app/etl-data/extraidos
    ports:
      - '3001:3001'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- https://api.buscadados.bjsoft.com.br/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ./frontend
    container_name: rfb_frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      CHOKIDAR_USEPOLLING: 'true'
    ports:
      - '4200:4200'

  pgadmin:
    image: dpage/pgadmin4:9
    container_name: rfb_pgadmin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@bjsoft.com.br}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin123}
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: 'False'
      PGADMIN_CONFIG_LOGIN_BANNER: '"RFB Data Service - Ambiente local"'
    volumes:
      - rfb_pgadmin:/var/lib/pgadmin
      - ./pgadmin-servers.json:/pgadmin4/servers.json:ro
    ports:
      - '5050:80'

volumes:
  rfb_pgdata:
  rfb_pgadmin:
  # rfb_etldata removido — arquivos ETL agora vivem no host em ./etl-data/
